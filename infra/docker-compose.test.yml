version: '3.8'

services:
  bot-test:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    env_file: "${TG_TEST_ENV_FILE:-../.env}"
    environment:
      # Python path for imports
      - PYTHONPATH=/app:/app/packages/ai_workflow_engine:/app/packages/ai_workflow_tools:/app/packages/ai_workflow_viewer
      # Double opt-in pass-through for the live engine qualification suite (Q1.2):
      # both must be exported on the HOST shell; .env alone must not enable paid runs.
      - ALLOW_PAID_TESTS=${ALLOW_PAID_TESTS:-}
      - RUN_ENGINE_SUBSCRIPTION_QUALIFICATION=${RUN_ENGINE_SUBSCRIPTION_QUALIFICATION:-}
      # Model-routing levers for the live workflow-graph integration suites: route the
      # anki / reminder graph text roles to a specific backend (e.g. chatgpt-web) for a
      # single run without editing config. Empty = each suite's own default.
      - ANKI_GRAPH_TEST_MODEL=${ANKI_GRAPH_TEST_MODEL:-}
      - REMINDER_GRAPH_TEST_MODEL=${REMINDER_GRAPH_TEST_MODEL:-}
      # Explicit no-spend local-provider qualification. The test file still requires its
      # own RUN_OLLAMA_PROVIDER_QUALIFICATION=1 gate before touching the host service.
      - RUN_OLLAMA_PROVIDER_QUALIFICATION=${RUN_OLLAMA_PROVIDER_QUALIFICATION:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-}
      # CHATGPT_BROWSER_API_URL / _TOKEN deliberately have NO passthrough here: an
      # `environment:` entry always beats env_file, so `${VAR:-}` with an unset caller
      # shell would shadow the real values loaded from ../.env with EMPTY strings
      # (incident handoff 2026-07-22, consumer fix 4). The gitignored .env is the one
      # source; secrets never ride the caller shell or this file.
    volumes:
      # Mount source code for development
      - ../:/app
      # Mount test results output
      - ./test-results:/app/test-results
    working_dir: /app
    command: >
      bash -c "
        echo 'Running tests...' &&
        python -m pytest tests/ -v --log-cli-level=DEBUG --log-cli-format='%(asctime)s [%(levelname)s] %(name)s - %(message)s' --cov=services --cov=ai_workflow_engine --cov=ai_workflow_viewer --cov=platforms --cov=database --cov=models --cov=core --cov-report=term-missing --cov-report=html:/app/test-results/htmlcov --cov-report=xml:/app/test-results/coverage.xml --junit-xml=/app/test-results/junit.xml
      "
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
