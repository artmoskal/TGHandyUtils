version: '3.8'

services:
  bot-test-integration:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    env_file:
      - ../.env  # Load real environment variables including API keys
    environment:
      - PYTHONPATH=/app
      - TEST_TYPE=integration  # Marker for integration tests
      # Double opt-in pass-through for the live engine qualification suite (Q1.2):
      # both must be exported on the HOST shell; .env alone must not enable paid runs.
      - ALLOW_PAID_TESTS=${ALLOW_PAID_TESTS:-}
      - RUN_ENGINE_SUBSCRIPTION_QUALIFICATION=${RUN_ENGINE_SUBSCRIPTION_QUALIFICATION:-}
    volumes:
      - ../:/app
      - ./test-results:/app/test-results
    working_dir: /app
    command: >
      bash -c "
        echo '=== Running integration tests ===' &&
        python -m pytest ${TEST_PATH:-tests/integration/} ${PYTEST_ARGS:--v} --tb=short
      "
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
