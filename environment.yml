name: TGHandyUtils
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - sqlite

  # Optional packages for extended timezone and datetime support
  - tzdata
  
  # Runtime and test dependencies are pinned together in pip to avoid
  # Conda/pip resolver splits across LangChain, LangGraph, OpenAI, and Pydantic.
  - pip:
      # Telegram bot runtime
      - aiogram==3.28.2

      # OpenAI + workflow orchestration stack
      - -e ./packages/ai_workflow_engine
      - -e ./packages/ai_workflow_tools
      - openai==2.41.0
      - langchain-core==1.4.0
      - langchain-openai==1.2.2
      - langgraph==1.2.4
      - pydantic==2.13.4

      # Application runtime
      - dependency-injector==4.49.0
      - genanki==0.13.1
      - python-dotenv==1.2.2
      - python-dateutil==2.9.0.post0
      - requests==2.34.2
      - PyYAML==6.0.3

      # Google Calendar/OAuth runtime
      - google-auth==2.53.0
      - google-api-python-client==2.197.0
      - google-auth-httplib2==0.4.0
      - google-auth-oauthlib==1.4.0

      # Tests
      - pytest==9.0.3
      - pytest-asyncio==1.4.0
      - pytest-mock==3.15.1
      - pytest-cov==7.1.0
      - coverage==7.14.1
      - aioresponses==0.7.8
      - factory-boy==3.3.3
      - freezegun==1.5.5
