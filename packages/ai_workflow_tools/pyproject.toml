[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-tools"
version = "0.6.2"
description = "Reusable provider, agent, and media adapters for ai-workflow-engine."
requires-python = ">=3.10"
dependencies = [
    # The latest-only tools line targets the engine 0.11.x contract.
    "ai-workflow-engine>=0.11.11,<0.12",
    "pydantic>=2.13.0",
]

[project.optional-dependencies]
openai = [
    "httpx>=0.28.1",
]
media = [
    "openai>=2.41.0",
    "requests>=2.34.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_workflow_tools*"]

[tool.setuptools.package-data]
ai_workflow_tools = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: tools package unit tests",
    "integration: tools package integration-style tests (still hermetic/fake-backed)",
]
