[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-tools"
version = "0.3.0"
description = "Reusable CLI-agent tools for ai-workflow-engine."
requires-python = ">=3.10"
dependencies = [
    # Bounded now (works for the current 0.8.1 AND the pending 0.9 tag); Phase 5.1 lockstep
    # tightens to >=0.9,<0.10 with the version bump.
    "ai-workflow-engine>=0.8.1,<0.10",
    "pydantic>=2.13.0",
]

[project.optional-dependencies]
media = [
    "openai>=2.41.0",
    "requests>=2.34.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_workflow_tools*"]

[tool.setuptools.package-data]
ai_workflow_tools = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: tools package unit tests",
    "integration: tools package integration-style tests (still hermetic/fake-backed)",
]
