[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-tools"
version = "0.2.0"
description = "Reusable CLI-agent tools for ai-workflow-engine."
requires-python = ">=3.10"
dependencies = [
    "ai-workflow-engine",
    "pydantic>=2.13.0",
]

[project.optional-dependencies]
media = [
    "openai>=2.41.0",
    "requests>=2.34.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_workflow_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: tools package unit tests",
    "integration: tools package integration-style tests (still hermetic/fake-backed)",
]
