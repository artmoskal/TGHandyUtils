[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-tools"
version = "0.5.0"
description = "Reusable CLI-agent tools for ai-workflow-engine."
requires-python = ">=3.10"
dependencies = [
    # Lockstep with the engine v0.10 release (the tools 0.4.0 wheel targets engine 0.10.x).
    "ai-workflow-engine>=0.11,<0.12",
    "pydantic>=2.13.0",
]

[project.optional-dependencies]
media = [
    "openai>=2.41.0",
    "requests>=2.34.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_workflow_tools*"]

[tool.setuptools.package-data]
ai_workflow_tools = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: tools package unit tests",
    "integration: tools package integration-style tests (still hermetic/fake-backed)",
]
