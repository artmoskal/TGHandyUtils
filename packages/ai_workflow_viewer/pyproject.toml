[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-viewer"
version = "0.4.1"
description = "Standalone observability viewer for ai-workflow-engine observation bundles."
requires-python = ">=3.10"
dependencies = [
    # Downstream-only: the viewer reads engine artifacts; the engine NEVER depends on the viewer.
    "ai-workflow-engine>=0.12.0,<0.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_workflow_viewer*"]

[tool.setuptools.package-data]
ai_workflow_viewer = ["py.typed", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
