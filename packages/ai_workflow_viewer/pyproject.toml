[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-viewer"
version = "0.2.0"
description = "Standalone observability viewer for ai-workflow-engine observation bundles."
requires-python = ">=3.10"
dependencies = [
    # Downstream-only: the viewer reads engine artifacts; the engine NEVER depends on the viewer.
    "ai-workflow-engine>=0.8.1,<0.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_workflow_viewer*"]

[tool.setuptools.package-data]
ai_workflow_viewer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
