[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-engine"
version = "0.12.2"
description = "Small reusable AI workflow orchestration primitives."
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.4.0",
    # LangGraph is the WorkflowExecutor's internal execution backend: a WorkflowDefinition is compiled
    # to a StateGraph in executor.py. Declared here so the engine is installable standalone.
    "langgraph>=1.2.4",
    "pydantic>=2.13.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_workflow_engine*"]

[tool.setuptools.package-data]
ai_workflow_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: engine unit tests",
    "integration: integration-style tests (still hermetic/fake-backed)",
]
